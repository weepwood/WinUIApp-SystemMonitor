name: Windows Build

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a WinUI 3 x64 installer (e.g. v1.0.0); leave empty for a debug build'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build WinUI 3 (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore WinUIApp.csproj -p:Platform=x64 -p:RuntimeIdentifier=win-x64
      - name: Build
        run: dotnet build WinUIApp.csproj --no-restore -c Debug -p:Platform=x64 -p:RuntimeIdentifier=win-x64

  release:
    name: Publish WinUI 3 installer (x64)
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Validate release version
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a release tag such as v1.0.0' }
      - name: Publish unpackaged app with .NET and Windows App SDK runtimes
        run: >-
          dotnet publish WinUIApp.csproj -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:Version=$($env:RELEASE_TAG.Substring(1)) -o portable
      - name: Compile per-user installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is required on the Windows runner' }
          & $iscc "/DAppVersion=$($env:RELEASE_TAG.Substring(1))" Packaging/SystemMonitor.iss
      - name: Install and launch the full WinUI app
        run: |
          $setup = (Resolve-Path "installer/SystemMonitor-$env:RELEASE_TAG-win-x64-setup.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP 'System Monitor smoke test'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $app = Start-Process "$dir/WinUIApp.exe" -WorkingDirectory $dir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Startup failed: $($app.ExitCode)" }
            } until ($app.MainWindowHandle -ne 0 -or (Get-Date) -ge $deadline)
            if ($app.MainWindowHandle -eq 0) { throw 'No main window appeared' }
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw 'App exited after opening the main window' }
          } finally {
            if (!$app.HasExited) { $app.Kill(); $app.WaitForExit() }
          }
          $uninstall = Start-Process "$dir/unins000.exe" -ArgumentList '/VERYSILENT','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$dir/WinUIApp.exe")) { throw 'Uninstall failed' }
      - name: Release the tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = "SystemMonitor-$env:RELEASE_TAG-win-x64-setup.exe"
          $hash = (Get-FileHash "installer/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -Encoding ascii "installer/$file.sha256"
          gh release create $env:RELEASE_TAG "installer/$file" "installer/$file.sha256" --latest --target $env:GITHUB_SHA --title "System Monitor $env:RELEASE_TAG · WinUI 3 完整版" --notes "下载 setup.exe 安装完整版，无需单独配置 .NET 或 Windows App SDK。安装后从开始菜单打开 System Monitor。新增主题、窗口置顶与采样偏好；保留 Mica 背景、Fluent 导航、性能曲线和进程内存排行。"
